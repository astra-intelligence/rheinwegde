<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <defs>
    <path id="star" d="M0 -1L0.2245 -0.309L0.951 -0.309L0.363 0.118L0.588 0.809L0 0.382L-0.588 0.809L-0.363 0.118L-0.951 -0.309L-0.2245 -0.309Z"/>
    <g id="building">
      <rect width="150" height="180" rx="6" fill="#fff" stroke="#0f172a" stroke-width="3"/>
      <g fill="#bfdbfe">
        <rect x="18" y="20" width="26" height="22" rx="3"/><rect x="62" y="20" width="26" height="22" rx="3"/><rect x="106" y="20" width="26" height="22" rx="3"/>
        <rect x="18" y="56" width="26" height="22" rx="3"/><rect x="62" y="56" width="26" height="22" rx="3"/><rect x="106" y="56" width="26" height="22" rx="3"/>
        <rect x="18" y="92" width="26" height="22" rx="3"/><rect x="62" y="92" width="26" height="22" rx="3"/><rect x="106" y="92" width="26" height="22" rx="3"/>
        <rect x="18" y="128" width="26" height="22" rx="3"/><rect x="106" y="128" width="26" height="22" rx="3"/>
      </g>
      <rect x="62" y="138" width="26" height="42" rx="3" fill="#2563eb"/>
    </g>
  </defs>
  <rect width="800" height="360" fill="#f1f5f9"/>
  <circle cx="400" cy="200" r="130" fill="#dbeafe"/>
  <circle cx="80" cy="60" r="70" fill="#e0e7ff"/>
  <circle cx="720" cy="60" r="70" fill="#e0e7ff"/>
  <!-- ground -->
  <rect x="40" y="300" width="720" height="4" rx="2" fill="#cbd5e1"/>
  <!-- two identical buildings: same size, style and windows; only the flags differ -->
  <use href="#building" x="70" y="120"/>
  <use href="#building" x="580" y="120"/>
  <!-- flag DE (5:3) -->
  <rect x="142" y="70" width="3" height="50" fill="#0f172a"/>
  <rect x="145" y="70" width="42" height="8.4" fill="#0f172a"/><rect x="145" y="78.4" width="42" height="8.4" fill="#dc2626"/><rect x="145" y="86.8" width="42" height="8.4" fill="#facc15"/>
  <!-- flag CN: five-star red flag (3:2), 30x20 grid, 1 unit = 1.4px; small stars point to the large star -->
  <rect x="652" y="70" width="3" height="50" fill="#0f172a"/>
  <rect x="655" y="70" width="42" height="28" fill="#dc2626"/>
  <g transform="translate(655 70) scale(1.4)" fill="#facc15">
    <use href="#star" transform="translate(5 5) scale(3)"/>
    <use href="#star" transform="translate(10 2) rotate(239.04)"/>
    <use href="#star" transform="translate(12 4) rotate(261.87)"/>
    <use href="#star" transform="translate(12 7) rotate(-74.05)"/>
    <use href="#star" transform="translate(10 9) rotate(-51.34)"/>
  </g>
  <!-- connection arc -->
  <path d="M220 160 Q400 30 580 160" stroke="#2563eb" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
  <circle cx="220" cy="160" r="6" fill="#2563eb"/><circle cx="580" cy="160" r="6" fill="#2563eb"/>
  <!-- chat bubbles -->
  <g font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">
    <path d="M250 72 h70 a12 12 0 0 1 12 12 v22 a12 12 0 0 1 -12 12 h-46 l-14 12 v-12 h-10 a12 12 0 0 1 -12 -12 v-22 a12 12 0 0 1 12 -12z" fill="#0f172a"/>
    <text x="285" y="101" fill="#fff">Hallo</text>
    <path d="M480 72 h70 a12 12 0 0 1 12 12 v22 a12 12 0 0 1 -12 12 h-10 v12 l-14 -12 h-46 a12 12 0 0 1 -12 -12 v-22 a12 12 0 0 1 12 -12z" fill="#2563eb"/>
    <text x="515" y="101" fill="#fff">你好</text>
  </g>
  <!-- contract -->
  <g transform="translate(330 150)">
    <rect width="140" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="20" width="70" height="10" rx="5" fill="#0f172a"/>
    <rect x="20" y="44" width="100" height="6" rx="3" fill="#cbd5e1"/><rect x="20" y="58" width="92" height="6" rx="3" fill="#cbd5e1"/><rect x="20" y="72" width="100" height="6" rx="3" fill="#cbd5e1"/><rect x="20" y="86" width="64" height="6" rx="3" fill="#cbd5e1"/>
    <path d="M20 122 q10 -14 18 0 t18 0 t14 -6" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M80 122 q8 -12 16 0 t16 -2" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="20" y1="130" x2="120" y2="130" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="118" cy="30" r="12" fill="#2563eb"/><path d="M112 30 l4 4 l8 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
